name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B clean verify
      - name: Create or update release
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" target/AttributeSwapFolia-*.jar --clobber
          else
            gh release create "${GITHUB_REF_NAME}" target/AttributeSwapFolia-*.jar --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
