name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B clean verify
      - uses: actions/upload-artifact@v4
        with:
          name: AttributeSwapFolia-java-${{ matrix.java }}
          path: target/AttributeSwapFolia-*.jar
          if-no-files-found: error
